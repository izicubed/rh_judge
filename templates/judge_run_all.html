<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Judge · All Pilots</title>
<script src="/static/socket.io-4.6.1/socket.io.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #0a0c10;
    --surface:     #12151b;
    --surface-2:   #1a1e27;
    --border:      rgba(255,255,255,0.07);
    --success:     #4ade80;
    --success-dim: rgba(74,222,128,0.12);
    --danger:      #f87171;
    --danger-dim:  rgba(248,113,113,0.12);
    --warn:        #fbbf24;
    --warn-dim:    rgba(251,191,36,0.12);
    --text:        #e2e8f0;
    --text-2:      #94a3b8;
    --text-3:      #475569;
    --radius:      10px;
    --radius-sm:   6px;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 1.25rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    gap: 1rem;
  }
  .hdr-left { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
  .logo {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #00d4ff;
    white-space: nowrap;
  }
  .hdr-badge {
    background: rgba(0,212,255,0.12);
    color: #00d4ff;
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 999px;
    padding: 0.2rem 0.7rem;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }

  /* Compact timer + status in header */
  .hdr-right { display: flex; align-items: center; gap: 0.9rem; }
  .hdr-timer {
    font-size: 1.7rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    color: var(--text);
    line-height: 1;
    transition: color 0.3s;
  }
  .hdr-timer.racing { color: #00d4ff; text-shadow: 0 0 24px rgba(0,212,255,0.25); }
  .hdr-timer.done   { color: var(--text-3); }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.28rem 0.8rem;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 1px solid transparent;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .status-badge::before {
    content: '';
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
  }
  .status-ready    { background: var(--surface-2); color: var(--text-3); border-color: var(--border); }
  .status-staging  { background: var(--warn-dim);  color: var(--warn);   border-color: rgba(251,191,36,0.3); }
  .status-racing   { background: rgba(0,212,255,0.12); color: #00d4ff; border-color: rgba(0,212,255,0.3); }
  .status-racing::before { animation: pulse 1s infinite; }
  .status-done     { background: var(--success-dim);color: var(--success);border-color: rgba(74,222,128,0.3); }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ── Grid of pilot cards ── */
  main {
    max-width: 1500px;
    margin: 0 auto;
    padding: 1.1rem 1rem 2.5rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 0.9rem;
  }
  .empty-msg {
    text-align: center;
    color: var(--text-3);
    font-size: 0.95rem;
    padding: 4rem 1rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    --accent: #00d4ff;
    --accent-rgb: 0,212,255;
    --accent-hover: #22deff;
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .seat-key {
    flex: none;
    width: 1.9rem; height: 1.9rem;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm);
    background: rgba(var(--accent-rgb),0.12);
    color: var(--accent);
    border: 1px solid rgba(var(--accent-rgb),0.3);
    font-weight: 700;
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
  }
  .card-pilot {
    flex: 1;
    min-width: 0;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-count {
    flex: none;
    font-size: 0.72rem;
    color: var(--text-3);
    background: var(--surface-2);
    border-radius: 999px;
    padding: 0.15rem 0.55rem;
    white-space: nowrap;
  }

  /* Add Lap button */
  .add-lap-btn {
    width: 100%;
    padding: 0.85rem;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s, opacity 0.2s;
    box-shadow: 0 4px 18px rgba(var(--accent-rgb),0.22);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .add-lap-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .add-lap-btn:active:not(:disabled) { transform: scale(0.97); }
  .add-lap-btn:disabled {
    background: var(--surface-2);
    color: var(--text-3);
    box-shadow: none;
    cursor: not-allowed;
  }
  .add-lap-btn .btn-plus { font-size: 1.3rem; line-height: 1; font-weight: 300; }
  .add-lap-btn.flash {
    background: var(--success) !important;
    box-shadow: 0 6px 28px rgba(74,222,128,0.4);
    transform: scale(1.03);
  }
  .add-lap-btn .last-lap {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: none;
    opacity: 0.8;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }

  /* Lap history (compact, scrollable) */
  .laps {
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
  }
  .laps.empty { display: none; }
  .lap-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.6rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .lap-row:last-child { border-bottom: none; }
  .lap-row:hover { background: var(--surface-2); }
  .lap-row .ln {
    flex: none;
    width: 1.4rem;
    font-weight: 700;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }
  .lap-row .ts {
    flex: none;
    width: 4.4rem;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: var(--accent);
    font-size: 0.8rem;
  }
  .lap-row .lt {
    flex: 1;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: var(--text-2);
    font-size: 0.8rem;
    text-align: right;
  }
  .lap-row .acts { flex: none; display: flex; gap: 0.15rem; }
  .btn-icon-sm {
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0.2rem 0.35rem;
    border-radius: var(--radius-sm);
    font-size: 0.95rem;
    line-height: 1;
    color: var(--text-3);
    transition: background 0.15s, color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-icon-sm:hover { background: var(--surface-2); }
  .btn-edit:hover  { color: var(--accent); }
  .btn-delete:hover{ color: var(--danger); background: var(--danger-dim); }
  .no-laps {
    text-align: center;
    color: var(--text-3);
    font-size: 0.8rem;
    padding: 0.9rem 0;
  }

  /* ── Edit modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 1rem;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    width: 100%; max-width: 360px;
    display: flex; flex-direction: column; gap: 1rem;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6);
  }
  .modal h3 { font-size: 1rem; font-weight: 600; color: var(--text); }
  .modal label { font-size: 0.8rem; color: var(--text-2); display: block; margin-bottom: 0.4rem; }
  .modal input[type="number"] {
    width: 100%;
    padding: 0.7rem 0.9rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 1rem;
    font-family: 'SF Mono', 'Fira Code', monospace;
    outline: none;
    transition: border-color 0.2s;
  }
  .modal input[type="number"]:focus { border-color: #00d4ff; }
  .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; }
  .btn-secondary {
    padding: 0.6rem 1.1rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-2);
    font-size: 0.875rem; font-weight: 500;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-secondary:hover { background: #222530; }
  .btn-primary {
    padding: 0.6rem 1.1rem;
    background: #00d4ff;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--bg);
    font-size: 0.875rem; font-weight: 700;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-primary:hover { background: #22deff; }

  /* Locked (after Save & Clear) */
  body.locked .add-lap-btn,
  body.locked .btn-icon-sm { display: none !important; }
  .hint {
    text-align: center;
    color: var(--text-3);
    font-size: 0.78rem;
    margin: 0.9rem 0 0;
  }
  .hint kbd {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0.05rem 0.4rem;
    font-family: 'SF Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-2);
  }
</style>
</head>
<body>

<header>
  <div class="hdr-left">
    <span class="logo">◈ Judge</span>
    <span class="hdr-badge">All Pilots</span>
  </div>
  <div class="hdr-right">
    <span id="status-badge" class="status-badge status-ready">READY</span>
    <span id="race-timer" class="hdr-timer">00:00.00</span>
  </div>
</header>

<main>
  <div id="grid" class="grid"></div>
  <p id="empty-msg" class="empty-msg" style="display:none">No pilots assigned to this heat.</p>
  <p class="hint">Press <kbd>1</kbd>–<kbd>{{ max_nodes }}</kbd> on the keyboard to add a lap for that seat.</p>
</main>

<!-- Edit modal -->
<div id="edit-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3>Edit Lap Timestamp</h3>
    <div>
      <label for="edit-ts-input">Seconds from race start (e.g. 23.456)</label>
      <input type="number" id="edit-ts-input" step="0.001" min="0">
    </div>
    <div class="modal-actions">
      <button id="edit-cancel" class="btn-secondary">Cancel</button>
      <button id="edit-save"   class="btn-primary">Save</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const MAX_NODES = {{ max_nodes }};

  // Per-seat color palette (matches single judge_run.html pages)
  const PALETTE = {
    1: { accent: '#f87171', rgb: '248,113,113', hover: '#ff9090' },
    2: { accent: '#fbbf24', rgb: '251,191,36',  hover: '#ffd054' },
    3: { accent: '#4ade80', rgb: '74,222,128',  hover: '#6be59a' },
    4: { accent: '#00d4ff', rgb: '0,212,255',   hover: '#22deff' },
    5: { accent: '#a78bfa', rgb: '167,139,250', hover: '#bfa6ff' },
    6: { accent: '#fb923c', rgb: '251,146,60',  hover: '#fda85c' },
    7: { accent: '#f472b6', rgb: '244,114,182', hover: '#ff8ec5' },
    8: { accent: '#22d3ee', rgb: '34,211,238',  hover: '#5be0f3' },
  };

  // RaceStatus values (must match RHRace.py)
  const RS = { READY: 0, RACING: 1, DONE: 2, STAGING: 3 };

  const socket = io();

  // ── Time sync ─────────────────────────────────────────────────────
  let serverDiff = 0, syncT0 = 0, syncSamples = [];

  function doSync() { syncT0 = performance.now(); socket.emit('get_pi_time'); }

  socket.on('pi_time', function (msg) {
    const t1 = performance.now();
    const rtt = t1 - syncT0;
    const diff = msg.pi_time_s * 1000 - t1 + rtt / 2;
    syncSamples.push({ diff, rtt });
    if (syncSamples.length > 10) syncSamples.shift();
    const best = syncSamples.slice().sort((a, b) => a.rtt - b.rtt)[0];
    serverDiff = best.diff;
  });

  function serverMs() { return performance.now() + serverDiff; }

  // ── Race state ────────────────────────────────────────────────────
  let raceStatus = RS.READY;
  let raceStartMs = null;
  let prevStatus = -1;
  let sessionLocked = false;

  function elapsedMs() {
    if (!raceStartMs) return 0;
    return Math.max(0, serverMs() - raceStartMs);
  }

  socket.on('race_status', function (msg) {
    prevStatus = raceStatus;
    raceStatus = msg.race_status;
    if (msg.pi_starts_at_s) raceStartMs = msg.pi_starts_at_s * 1000;

    // New race starting — clear all local laps
    if (raceStatus === RS.STAGING && prevStatus !== RS.STAGING) {
      seats.forEach(function (s) { s.laps = []; });
      renderAllLaps();
    }
    if (raceStatus === RS.READY) {
      raceStartMs = null;
      setTimerDisplay(0);
    }

    updateStatusUI();
    refreshSeats();
  });

  function updateStatusUI() {
    const badge = document.getElementById('status-badge');
    const timer = document.getElementById('race-timer');

    const map = {
      [RS.READY]:   { label: 'READY',   cls: 'status-ready' },
      [RS.STAGING]: { label: 'STAGING', cls: 'status-staging' },
      [RS.RACING]:  { label: 'RACING',  cls: 'status-racing' },
      [RS.DONE]:    { label: 'DONE',    cls: 'status-done' },
    };
    const s = sessionLocked
      ? { label: 'SAVED', cls: 'status-done' }
      : (map[raceStatus] || { label: '—', cls: 'status-ready' });
    badge.textContent = s.label;
    badge.className = 'status-badge ' + s.cls;

    timer.className = 'hdr-timer' +
      (raceStatus === RS.RACING ? ' racing' : (raceStatus === RS.DONE || sessionLocked) ? ' done' : '');

    document.body.classList.toggle('locked', sessionLocked);

    // Add-lap buttons are only active while RACING and unlocked
    const enabled = (raceStatus === RS.RACING) && !sessionLocked;
    seats.forEach(function (s) {
      if (s.btnEl) s.btnEl.disabled = !enabled;
    });
  }

  // ── Timer formatting ──────────────────────────────────────────────
  function pad2(n) { return String(Math.floor(n)).padStart(2, '0'); }
  function pad3(n) { return String(Math.floor(n)).padStart(3, '0'); }

  function fmtTimer(ms) {
    const t = Math.max(0, ms);
    return pad2(Math.floor(t / 60000)) + ':' +
           pad2(Math.floor((t % 60000) / 1000)) + '.' +
           pad2(Math.floor((t % 1000) / 10));
  }
  function fmtLap(ms) {
    const t = Math.max(0, ms);
    const m = Math.floor(t / 60000);
    const s = Math.floor((t % 60000) / 1000);
    const mil = t % 1000;
    return (m > 0 ? m + ':' + pad2(s) : s) + '.' + pad3(mil);
  }
  function setTimerDisplay(ms) {
    document.getElementById('race-timer').textContent = fmtTimer(ms);
  }
  setInterval(function () {
    if (raceStatus === RS.RACING) setTimerDisplay(elapsedMs());
  }, 50);

  // ── Seat model ────────────────────────────────────────────────────
  // seats = ordered array of { index, num, name, laps:[], els... }
  let seats = [];

  function seatByIndex(idx) {
    for (let i = 0; i < seats.length; i++) {
      if (seats[i].index === idx) return seats[i];
    }
    return null;
  }

  // Determine which seats to show from /judge/api/status, then (re)build the grid.
  function refreshSeats() {
    fetch('/judge/api/status')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        sessionLocked = !!data.locked;

        const pilotNames = data.pilot_names || {};
        const numSeats = data.num_seats || MAX_NODES;

        // Build target seat list: nodes with a pilot assigned.
        // If none are assigned (e.g. mock/dev), fall back to all seats.
        let target = [];
        for (let i = 0; i < MAX_NODES; i++) {
          if (pilotNames[String(i)]) {
            target.push({ index: i, name: pilotNames[String(i)] });
          }
        }
        if (target.length === 0) {
          for (let i = 0; i < numSeats; i++) {
            target.push({ index: i, name: 'No pilot assigned' });
          }
        }

        // Rebuild the grid only when the set of seat indices changes.
        const newKey = target.map(function (t) { return t.index; }).join(',');
        const oldKey = seats.map(function (s) { return s.index; }).join(',');
        if (newKey !== oldKey) {
          buildGrid(target);
          seats.forEach(function (s) { fetchLaps(s); });
        } else {
          // Same seats — just refresh pilot names.
          target.forEach(function (t) {
            const s = seatByIndex(t.index);
            if (s) { s.name = t.name; if (s.nameEl) s.nameEl.textContent = t.name; }
          });
        }

        updateStatusUI();
      })
      .catch(function () {});
  }

  function buildGrid(target) {
    const grid = document.getElementById('grid');
    const emptyMsg = document.getElementById('empty-msg');
    grid.innerHTML = '';
    seats = [];

    if (!target.length) {
      emptyMsg.style.display = '';
      return;
    }
    emptyMsg.style.display = 'none';

    target.forEach(function (t) {
      const num = t.index + 1;
      const pal = PALETTE[num] || PALETTE[4];

      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--accent', pal.accent);
      card.style.setProperty('--accent-rgb', pal.rgb);
      card.style.setProperty('--accent-hover', pal.hover);

      // Head: seat key, pilot name, lap count
      const head = document.createElement('div');
      head.className = 'card-head';

      const key = document.createElement('span');
      key.className = 'seat-key';
      key.textContent = num;
      head.appendChild(key);

      const nameEl = document.createElement('span');
      nameEl.className = 'card-pilot';
      nameEl.textContent = t.name;
      head.appendChild(nameEl);

      const countEl = document.createElement('span');
      countEl.className = 'card-count';
      countEl.textContent = '0 laps';
      head.appendChild(countEl);

      card.appendChild(head);

      // Add Lap button
      const btn = document.createElement('button');
      btn.className = 'add-lap-btn';
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-plus">+</span>ADD LAP<span class="last-lap"></span>';
      card.appendChild(btn);

      // Laps container
      const lapsEl = document.createElement('div');
      lapsEl.className = 'laps empty';
      card.appendChild(lapsEl);

      grid.appendChild(card);

      const seat = {
        index: t.index, num: num, name: t.name, laps: [],
        cardEl: card, nameEl: nameEl, countEl: countEl,
        btnEl: btn, lapsEl: lapsEl,
      };
      btn.addEventListener('click', function () { addLap(seat); });
      seats.push(seat);
    });
  }

  // ── Laps ──────────────────────────────────────────────────────────
  function fetchLaps(seat) {
    fetch('/judge/api/laps/' + seat.index)
      .then(function (r) { return r.json(); })
      .then(function (data) { seat.laps = data; renderLaps(seat); })
      .catch(function () {});
  }

  function renderAllLaps() { seats.forEach(renderLaps); }

  function renderLaps(seat) {
    const el = seat.lapsEl;
    el.innerHTML = '';
    seat.countEl.textContent = seat.laps.length +
      (seat.laps.length === 1 ? ' lap' : ' laps');

    // Show last lap time on the button
    const lastEl = seat.btnEl.querySelector('.last-lap');
    if (lastEl) {
      lastEl.textContent = seat.laps.length > 1
        ? fmtLap(seat.laps[seat.laps.length - 1].lap_time)
        : '';
    }

    if (!seat.laps.length) {
      el.classList.add('empty');
      return;
    }
    el.classList.remove('empty');

    // newest first for quick scanning
    for (let i = seat.laps.length - 1; i >= 0; i--) {
      const lap = seat.laps[i];
      const row = document.createElement('div');
      row.className = 'lap-row';

      const ln = document.createElement('span');
      ln.className = 'ln';
      ln.textContent = i;
      row.appendChild(ln);

      const ts = document.createElement('span');
      ts.className = 'ts';
      ts.textContent = fmtLap(lap.lap_time_stamp);
      row.appendChild(ts);

      const lt = document.createElement('span');
      lt.className = 'lt';
      lt.textContent = i === 0 ? '—' : fmtLap(lap.lap_time);
      row.appendChild(lt);

      const acts = document.createElement('span');
      acts.className = 'acts';
      if (!sessionLocked) {
        const be = document.createElement('button');
        be.className = 'btn-icon-sm btn-edit';
        be.title = 'Edit';
        be.textContent = '✎';
        be.onclick = (function (l) { return function () { openEdit(seat, l); }; }(lap));
        acts.appendChild(be);

        const bd = document.createElement('button');
        bd.className = 'btn-icon-sm btn-delete';
        bd.title = 'Delete';
        bd.textContent = '×';
        bd.onclick = (function (id) { return function () { deleteLap(seat, id); }; }(lap.id));
        acts.appendChild(bd);
      }
      row.appendChild(acts);

      el.appendChild(row);
    }
  }

  function addLap(seat) {
    if (raceStatus !== RS.RACING || sessionLocked) return;
    const ts = elapsedMs();
    fetch('/judge/api/laps/' + seat.index, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lap_time_stamp: ts }),
    })
      .then(function (r) { return r.json(); })
      .then(function (lap) {
        if (lap && lap.id) {
          seat.laps.push(lap);
          renderLaps(seat);
        }
        seat.btnEl.classList.add('flash');
        setTimeout(function () { seat.btnEl.classList.remove('flash'); }, 300);
      })
      .catch(function () {});
  }

  function deleteLap(seat, lapId) {
    fetch('/judge/api/laps/entry/' + lapId, { method: 'DELETE' })
      .then(function () {
        seat.laps = seat.laps.filter(function (l) { return l.id !== lapId; });
        renderLaps(seat);
      })
      .catch(function () {});
  }

  // ── Edit modal (shared) ───────────────────────────────────────────
  let editSeat = null, editingLapId = null;

  function openEdit(seat, lap) {
    editSeat = seat;
    editingLapId = lap.id;
    const inp = document.getElementById('edit-ts-input');
    inp.value = (lap.lap_time_stamp / 1000).toFixed(3);
    document.getElementById('edit-modal').style.display = 'flex';
    inp.focus();
    inp.select();
  }
  function closeEdit() {
    document.getElementById('edit-modal').style.display = 'none';
    editSeat = null;
    editingLapId = null;
  }
  function saveEdit() {
    if (!editingLapId || !editSeat) return;
    const newTs = parseFloat(document.getElementById('edit-ts-input').value) * 1000;
    if (isNaN(newTs) || newTs < 0) return;
    const seat = editSeat, lapId = editingLapId;
    fetch('/judge/api/laps/entry/' + lapId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lap_time_stamp: newTs }),
    })
      .then(function (r) { return r.json(); })
      .then(function (updated) {
        const idx = seat.laps.findIndex(function (l) { return l.id === lapId; });
        if (idx >= 0) seat.laps[idx] = updated;
        closeEdit();
        renderLaps(seat);
      })
      .catch(function () {});
  }

  document.getElementById('edit-cancel').addEventListener('click', closeEdit);
  document.getElementById('edit-save').addEventListener('click', saveEdit);
  document.getElementById('edit-ts-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') saveEdit();
    if (e.key === 'Escape') closeEdit();
    e.stopPropagation();  // keep seat hotkeys from firing while editing
  });
  document.getElementById('edit-modal').addEventListener('click', function (e) {
    if (e.target === this) closeEdit();
  });

  // ── Keyboard: digit 1..8 → add lap for that seat ──────────────────
  document.addEventListener('keydown', function (e) {
    // ignore when typing in a field or modal is open
    if (document.getElementById('edit-modal').style.display === 'flex') return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    // accept top-row digits and numpad
    let n = null;
    if (e.key >= '1' && e.key <= '8') n = parseInt(e.key, 10);
    if (n === null) return;

    const seat = seatByIndex(n - 1);
    if (!seat) return;
    e.preventDefault();
    addLap(seat);
  });

  // ── Init ──────────────────────────────────────────────────────────
  socket.on('connect', function () {
    doSync();
    socket.emit('load_data', { load_types: ['race_status'] });
    refreshSeats();
  });

  // Periodic refresh of pilot assignment / lock state
  setInterval(refreshSeats, 4000);
  setInterval(doSync, 5000);
}());
</script>
</body>
</html>
