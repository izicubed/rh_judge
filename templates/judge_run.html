<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Judge · Node {{ node_num }}</title>
<script src="/static/socket.io-4.6.1/socket.io.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #0a0c10;
    --surface:     #12151b;
    --surface-2:   #1a1e27;
    --border:      rgba(255,255,255,0.07);
    --accent:      #00d4ff;
    --accent-dim:  rgba(0,212,255,0.12);
    --accent-glow: rgba(0,212,255,0.25);
    --success:     #4ade80;
    --success-dim: rgba(74,222,128,0.12);
    --danger:      #f87171;
    --danger-dim:  rgba(248,113,113,0.12);
    --warn:        #fbbf24;
    --warn-dim:    rgba(251,191,36,0.12);
    --text:        #e2e8f0;
    --text-2:      #94a3b8;
    --text-3:      #475569;
    --radius:      10px;
    --radius-sm:   6px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1.25rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .hdr-left { display: flex; align-items: center; gap: 0.75rem; }
  .logo {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .node-badge {
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 999px;
    padding: 0.2rem 0.7rem;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .pilot-name {
    font-size: 0.9rem;
    color: var(--text-2);
    max-width: 160px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Main layout ── */
  main {
    display: flex;
    flex-direction: column;
    gap: 0;
    max-width: 540px;
    margin: 0 auto;
    padding: 1.25rem 1rem 2rem;
  }

  /* ── Timer section ── */
  .timer-section {
    text-align: center;
    padding: 2rem 1rem 1.5rem;
  }
  .timer {
    font-size: clamp(3.5rem, 15vw, 5.5rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    color: var(--text);
    line-height: 1;
    transition: color 0.3s;
  }
  .timer.racing { color: var(--accent); text-shadow: 0 0 40px var(--accent-glow); }
  .timer.done   { color: var(--text-3); }

  /* ── Status badge ── */
  .status-wrap { margin-top: 0.9rem; display: flex; justify-content: center; }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.3rem 0.9rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 1px solid transparent;
    transition: all 0.3s;
  }
  .status-badge::before {
    content: '';
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }
  .status-ready    { background: var(--surface-2); color: var(--text-3); border-color: var(--border); }
  .status-staging  { background: var(--warn-dim);  color: var(--warn);   border-color: rgba(251,191,36,0.3); }
  .status-racing   { background: var(--accent-dim);color: var(--accent); border-color: rgba(0,212,255,0.3); }
  .status-racing::before { animation: pulse 1s infinite; }
  .status-done     { background: var(--success-dim);color: var(--success);border-color: rgba(74,222,128,0.3); }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }

  /* ── Add Lap button ── */
  .action-section { padding: 0.5rem 0 1.25rem; }
  .add-lap-btn {
    width: 100%;
    padding: 1.1rem;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s, opacity 0.2s;
    box-shadow: 0 4px 24px var(--accent-glow);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .add-lap-btn:hover:not(:disabled) {
    background: #22deff;
    box-shadow: 0 6px 32px var(--accent-glow);
  }
  .add-lap-btn:active:not(:disabled) {
    transform: scale(0.97);
  }
  .add-lap-btn:disabled {
    background: var(--surface-2);
    color: var(--text-3);
    box-shadow: none;
    cursor: not-allowed;
  }
  .add-lap-btn .btn-plus {
    font-size: 1.5rem;
    line-height: 1;
    font-weight: 300;
  }
  .add-lap-btn.flash {
    background: var(--success);
    box-shadow: 0 6px 32px rgba(74,222,128,0.4);
    transform: scale(1.02);
  }

  /* ── Laps section ── */
  .laps-section { display: flex; flex-direction: column; gap: 0.75rem; }
  .laps-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .laps-header h2 {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .lap-count {
    font-size: 0.75rem;
    color: var(--text-3);
    background: var(--surface-2);
    border-radius: 999px;
    padding: 0.15rem 0.6rem;
  }

  .no-laps {
    text-align: center;
    color: var(--text-3);
    font-size: 0.9rem;
    padding: 2rem 0;
  }

  .laps-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .laps-table thead th {
    padding: 0.6rem 0.85rem;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-3);
    background: var(--surface-2);
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .laps-table thead th:last-child { text-align: right; }
  .laps-table tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .laps-table tbody tr:last-child { border-bottom: none; }
  .laps-table tbody tr:hover { background: var(--surface-2); }
  .laps-table td {
    padding: 0.65rem 0.85rem;
    font-size: 0.9rem;
    vertical-align: middle;
  }
  .laps-table td.lap-num {
    font-weight: 700;
    color: var(--text-2);
    width: 2.5rem;
  }
  .laps-table td.lap-ts {
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: var(--accent);
    font-size: 0.85rem;
  }
  .laps-table td.lap-time {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.85rem;
    color: var(--text-2);
  }
  .laps-table td.lap-actions {
    text-align: right;
    white-space: nowrap;
    width: 5rem;
  }

  /* Icon buttons inside table */
  .btn-icon-sm {
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0.3rem 0.4rem;
    border-radius: var(--radius-sm);
    font-size: 1rem;
    line-height: 1;
    transition: background 0.15s, color 0.15s;
    color: var(--text-3);
    -webkit-tap-highlight-color: transparent;
  }
  .btn-icon-sm:hover { background: var(--surface-2); }
  .btn-edit:hover  { color: var(--accent); }
  .btn-delete:hover{ color: var(--danger); background: var(--danger-dim); }

  /* ── Edit modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 1rem;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6);
  }
  .modal h3 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
  }
  .modal label {
    font-size: 0.8rem;
    color: var(--text-2);
    display: block;
    margin-bottom: 0.4rem;
  }
  .modal input[type="number"] {
    width: 100%;
    padding: 0.7rem 0.9rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 1rem;
    font-family: 'SF Mono', 'Fira Code', monospace;
    outline: none;
    transition: border-color 0.2s;
  }
  .modal input[type="number"]:focus {
    border-color: var(--accent);
  }
  .modal-actions {
    display: flex;
    gap: 0.75rem;
    justify-content: flex-end;
  }
  .btn-secondary {
    padding: 0.6rem 1.1rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-2);
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-secondary:hover { background: #222530; }
  .btn-primary {
    padding: 0.6rem 1.1rem;
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    color: var(--bg);
    font-size: 0.875rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: #22deff; }

  /* ── Locked (after Save & Clear on /run) ── */
  body.locked .add-lap-btn,
  body.locked .btn-icon-sm { display: none !important; }

  /* ── Responsive ── */
  @media (max-width: 400px) {
    .pilot-name { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="hdr-left">
    <span class="logo">◈ Judge</span>
    <span class="node-badge">Node {{ node_num }}</span>
  </div>
  <span id="pilot-name" class="pilot-name">—</span>
</header>

<main>
  <!-- Timer -->
  <section class="timer-section">
    <div id="race-timer" class="timer">00:00.00</div>
    <div class="status-wrap">
      <span id="status-badge" class="status-badge status-ready">READY</span>
    </div>
  </section>

  <!-- Add Lap -->
  <section class="action-section">
    <button id="add-lap-btn" class="add-lap-btn" disabled>
      <span class="btn-plus">+</span>ADD LAP
    </button>
  </section>

  <!-- Lap history -->
  <section class="laps-section">
    <div class="laps-header">
      <h2>Lap History</h2>
      <span id="lap-count" class="lap-count">0 laps</span>
    </div>
    <p id="no-laps-msg" class="no-laps">No laps recorded yet.</p>
    <table id="laps-table" class="laps-table" style="display:none">
      <thead>
        <tr>
          <th>Lap</th>
          <th>Timestamp</th>
          <th>Lap Time</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="laps-body"></tbody>
    </table>
  </section>
</main>

<!-- Edit modal -->
<div id="edit-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3>Edit Lap Timestamp</h3>
    <div>
      <label for="edit-ts-input">Seconds from race start (e.g. 23.456)</label>
      <input type="number" id="edit-ts-input" step="0.001" min="0">
    </div>
    <div class="modal-actions">
      <button id="edit-cancel" class="btn-secondary">Cancel</button>
      <button id="edit-save"   class="btn-primary">Save</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const NODE_INDEX = {{ node_index }};
  const NODE_NUM   = {{ node_num }};

  // RaceStatus values (must match RHRace.py)
  const RS = { READY: 0, RACING: 1, DONE: 2, STAGING: 3 };

  // ── Socket.IO ──────────────────────────────────────────────────────
  const socket = io();

  // ── Time sync ─────────────────────────────────────────────────────
  let serverDiff  = 0;   // performance.now() offset to reach server monotonic ms
  let syncT0      = 0;
  let syncSamples = [];

  function doSync() {
    syncT0 = performance.now();
    socket.emit('get_pi_time');
  }

  socket.on('pi_time', function (msg) {
    const t1  = performance.now();
    const rtt = t1 - syncT0;
    const diff = msg.pi_time_s * 1000 - t1 + rtt / 2;
    syncSamples.push({ diff, rtt });
    if (syncSamples.length > 10) syncSamples.shift();
    // pick sample with lowest RTT (best estimate)
    const best = syncSamples.slice().sort((a, b) => a.rtt - b.rtt)[0];
    serverDiff = best.diff;
  });

  function serverMs() { return performance.now() + serverDiff; }

  // ── Race state ────────────────────────────────────────────────────
  let raceStatus   = RS.READY;
  let raceStartMs  = null;   // pi_starts_at_s * 1000
  let prevStatus   = -1;

  function elapsedMs() {
    if (!raceStartMs) return 0;
    return Math.max(0, serverMs() - raceStartMs);
  }

  socket.on('race_status', function (msg) {
    prevStatus  = raceStatus;
    raceStatus  = msg.race_status;
    if (msg.pi_starts_at_s) raceStartMs = msg.pi_starts_at_s * 1000;

    // New race starting — clear local laps
    if (raceStatus === RS.STAGING && prevStatus !== RS.STAGING) {
      laps = [];
      renderLaps();
    }
    if (raceStatus === RS.READY) {
      raceStartMs = null;
      setTimerDisplay(0);
    }

    updateStatusUI();
    fetchPilotName();
  });

  let sessionLocked = false;

  function updateStatusUI() {
    const btn   = document.getElementById('add-lap-btn');
    const badge = document.getElementById('status-badge');
    const timer = document.getElementById('race-timer');

    btn.disabled = (raceStatus !== RS.RACING) || sessionLocked;

    const map = {
      [RS.READY]:   { label: 'READY',   cls: 'status-ready' },
      [RS.STAGING]: { label: 'STAGING', cls: 'status-staging' },
      [RS.RACING]:  { label: 'RACING',  cls: 'status-racing' },
      [RS.DONE]:    { label: 'DONE',    cls: 'status-done' },
    };
    const s = sessionLocked
      ? { label: 'SAVED', cls: 'status-done' }
      : (map[raceStatus] || { label: '—', cls: 'status-ready' });
    badge.textContent = s.label;
    badge.className   = 'status-badge ' + s.cls;

    timer.className = 'timer' +
      (raceStatus === RS.RACING ? ' racing' : (raceStatus === RS.DONE || sessionLocked) ? ' done' : '');

    document.body.classList.toggle('locked', sessionLocked);
  }

  // ── Timer display ─────────────────────────────────────────────────
  function fmtTimer(ms) {
    const t  = Math.max(0, ms);
    const m  = Math.floor(t / 60000);
    const s  = Math.floor((t % 60000) / 1000);
    const cs = Math.floor((t % 1000) / 10);
    return pad2(m) + ':' + pad2(s) + '.' + pad2(cs);
  }

  function fmtLap(ms) {
    const t   = Math.max(0, ms);
    const m   = Math.floor(t / 60000);
    const s   = Math.floor((t % 60000) / 1000);
    const mil = t % 1000;
    return (m > 0 ? m + ':' + pad2(s) : s) + '.' + pad3(mil);
  }

  function pad2(n) { return String(Math.floor(n)).padStart(2, '0'); }
  function pad3(n) { return String(Math.floor(n)).padStart(3, '0'); }

  function setTimerDisplay(ms) {
    document.getElementById('race-timer').textContent = fmtTimer(ms);
  }

  setInterval(function () {
    if (raceStatus === RS.RACING) setTimerDisplay(elapsedMs());
  }, 50);

  // ── Pilot name + session lock ─────────────────────────────────────
  function fetchPilotName() {
    fetch('/judge/api/status')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        const name = data.pilot_names && data.pilot_names[String(NODE_INDEX)];
        document.getElementById('pilot-name').textContent = name || 'No pilot assigned';
        const wasLocked = sessionLocked;
        sessionLocked = !!data.locked;
        if (wasLocked !== sessionLocked) {
          updateStatusUI();
          renderLaps();
        }
      })
      .catch(function () {});
  }

  // ── Lap data ──────────────────────────────────────────────────────
  let laps         = [];
  let editingLapId = null;

  function renderLaps() {
    const tbody  = document.getElementById('laps-body');
    const table  = document.getElementById('laps-table');
    const noMsg  = document.getElementById('no-laps-msg');
    const cntEl  = document.getElementById('lap-count');

    tbody.innerHTML = '';

    if (!laps.length) {
      table.style.display  = 'none';
      noMsg.style.display  = '';
      cntEl.textContent    = '0 laps';
      return;
    }

    noMsg.style.display = 'none';
    table.style.display = '';
    cntEl.textContent   = laps.length + (laps.length === 1 ? ' lap' : ' laps');

    laps.forEach(function (lap, idx) {
      const tr = document.createElement('tr');

      const tdN = document.createElement('td');
      tdN.className   = 'lap-num';
      tdN.textContent = idx;
      tr.appendChild(tdN);

      const tdTs = document.createElement('td');
      tdTs.className   = 'lap-ts';
      tdTs.textContent = fmtLap(lap.lap_time_stamp);
      tr.appendChild(tdTs);

      const tdLt = document.createElement('td');
      tdLt.className   = 'lap-time';
      tdLt.textContent = idx === 0 ? '—' : fmtLap(lap.lap_time);
      tr.appendChild(tdLt);

      const tdA = document.createElement('td');
      tdA.className = 'lap-actions';

      if (!sessionLocked) {
        const btnE = document.createElement('button');
        btnE.className = 'btn-icon-sm btn-edit';
        btnE.title     = 'Edit';
        btnE.textContent = '✎';
        btnE.onclick   = (function (l) { return function () { openEdit(l); }; }(lap));
        tdA.appendChild(btnE);

        const btnD = document.createElement('button');
        btnD.className   = 'btn-icon-sm btn-delete';
        btnD.title       = 'Delete';
        btnD.textContent = '×';
        btnD.onclick     = (function (id) { return function () { deleteLap(id); }; }(lap.id));
        tdA.appendChild(btnD);
      }

      tr.appendChild(tdA);
      tbody.appendChild(tr);
    });
  }

  function fetchLaps() {
    fetch('/judge/api/laps/' + NODE_INDEX)
      .then(function (r) { return r.json(); })
      .then(function (data) { laps = data; renderLaps(); })
      .catch(function () {});
  }

  // ── Add lap ───────────────────────────────────────────────────────
  document.getElementById('add-lap-btn').addEventListener('click', function () {
    const ts = elapsedMs();
    fetch('/judge/api/laps/' + NODE_INDEX, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ lap_time_stamp: ts }),
    })
      .then(function (r) { return r.json(); })
      .then(function (lap) {
        laps.push(lap);
        renderLaps();
        // flash green feedback
        const btn = document.getElementById('add-lap-btn');
        btn.classList.add('flash');
        setTimeout(function () { btn.classList.remove('flash'); }, 300);
      })
      .catch(function () {});
  });

  // ── Delete lap ────────────────────────────────────────────────────
  function deleteLap(lapId) {
    fetch('/judge/api/laps/entry/' + lapId, { method: 'DELETE' })
      .then(function () {
        laps = laps.filter(function (l) { return l.id !== lapId; });
        renderLaps();
      })
      .catch(function () {});
  }

  // ── Edit modal ────────────────────────────────────────────────────
  function openEdit(lap) {
    editingLapId = lap.id;
    const inp    = document.getElementById('edit-ts-input');
    inp.value    = (lap.lap_time_stamp / 1000).toFixed(3);
    document.getElementById('edit-modal').style.display = 'flex';
    inp.focus();
    inp.select();
  }

  function closeEdit() {
    document.getElementById('edit-modal').style.display = 'none';
    editingLapId = null;
  }

  function saveEdit() {
    if (!editingLapId) return;
    const newTs = parseFloat(document.getElementById('edit-ts-input').value) * 1000;
    if (isNaN(newTs) || newTs < 0) return;
    fetch('/judge/api/laps/entry/' + editingLapId, {
      method:  'PUT',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ lap_time_stamp: newTs }),
    })
      .then(function (r) { return r.json(); })
      .then(function (updated) {
        const idx = laps.findIndex(function (l) { return l.id === editingLapId; });
        if (idx >= 0) laps[idx] = updated;
        closeEdit();
        renderLaps();
      })
      .catch(function () {});
  }

  document.getElementById('edit-cancel').addEventListener('click', closeEdit);
  document.getElementById('edit-save').addEventListener('click', saveEdit);
  document.getElementById('edit-ts-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter')  saveEdit();
    if (e.key === 'Escape') closeEdit();
  });
  document.getElementById('edit-modal').addEventListener('click', function (e) {
    if (e.target === this) closeEdit();  // click outside modal closes it
  });

  // ── Init on connect ───────────────────────────────────────────────
  socket.on('connect', function () {
    doSync();
    socket.emit('load_data', { load_types: ['race_status'] });
    fetchLaps();
    fetchPilotName();
  });

  // Re-sync every 5 s
  setInterval(doSync, 5000);
}());
